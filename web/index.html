<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbfafc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>WithYou · A little closer, every day</title>
<meta name="description" content="WithYou is an AI companion for everyday conversation, gentle reflection, and a quieter place to be yourself.">
<meta name="wy-api" content="">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/screens.css">
<script>
  // Runs before the module graph so `API` is fixed to the right origin.
  (function () {
    var d = document.querySelector('meta[name=wy-api-default]');
    var stored = null;
    try { stored = localStorage.getItem('wy_api'); } catch (e) {}
    var v = stored || (d && d.content) || (location.protocol === 'file:' ? 'http://127.0.0.1:8765/api/v1' : '');
    document.querySelector('meta[name=wy-api]').setAttribute('content', v);
    try {
      if (matchMedia('(prefers-color-scheme: dark)').matches) { /* light-only product */ }
    } catch (e) {}
  })();
</script>
</head>
<body>
  <div id="app" role="application" aria-label="WithYou">
    <div class="loading-screen" id="boot">
      <div class="spinner" aria-hidden="true"></div>
      <p class="tiny">Opening WithYou…</p>
    </div>
  </div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <div id="sheet-root"></div>
  <noscript>
    <div style="padding:40px;font-family:system-ui">WithYou needs JavaScript enabled. / 需要开启 JavaScript。</div>
  </noscript>
  <script>
    /* 双击 index.html 会用 file:// 打开，而浏览器对 file:// 页面加载 ES module 一律按跨域
       处理（origin 是 "null"），js/app.js 会被直接拦掉 —— 页面就永远停在转圈上。
       这里在模块脚本之前给出明确出路，而不是让人对着加载动画猜。 */
    if (location.protocol === 'file:') {
      var bootEl = document.getElementById('boot');
      if (bootEl) {
        bootEl.innerHTML = ''
          + '<div style="padding:28px 22px;font-family:system-ui,sans-serif;line-height:1.55">'
          + '<h3 style="margin:0 0 10px;font-size:17px">通过本地服务打开</h3>'
          + '<p style="margin:0 0 12px;font-size:13px;color:#6b6b7b">'
          + '浏览器不允许 file:// 页面加载 ES module，双击打开这个文件是跑不起来的。'
          + '请先启动服务：</p>'
          + '<pre style="white-space:pre-wrap;background:#f2f1f7;padding:12px;border-radius:10px;'
          + 'font-size:12px;margin:0 0 12px">cd F:\\withyou\n'
          + 'python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8765</pre>'
          + '<p style="margin:0;font-size:13px;color:#6b6b7b">然后打开 '
          + '<a href="http://127.0.0.1:8765/" style="color:#5968ef">http://127.0.0.1:8765/</a>'
          + ' — 或者直接双击项目根目录的 <b>start-withyou.cmd</b>。</p>'
          + '</div>';
      }
    }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
